name: Release (fork)

on:
  push:
    tags:
      - 'v*-fork.*'   # e.g. v2026.08.19-fork.1
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v2026.08.19-fork.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build deps
        run: python -m pip install -U build pyinstaller

      - name: Build wheel
        if: matrix.os == 'ubuntu-latest'
        run: python -m build --wheel --outdir dist/

      - name: Build standalone binary
        run: |
          python -m pip install -e ".[default]"
          python -m bundle.pyinstaller

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/*.whl
            dist/yt-dlp_linux*
            dist/yt-dlp_macos*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: ${{ github.ref_name || inputs.tag }}
          body: |
            Fork release based on yt-dlp upstream.

            **Patches included:**
            - [PBS] Fix `KeyError('title')` + Next.js RSC fallback ([upstream #2606](https://github.com/yt-dlp/yt-dlp/issues/2606), [#17638](https://github.com/yt-dlp/yt-dlp/issues/17638))
            - [Odnoklassniki] Fix `TypeError` when metadata already a dict ([upstream #17585](https://github.com/yt-dlp/yt-dlp/issues/17585))

            **Install:**
            ```bash
            pipx install "yt-dlp @ git+https://github.com/slmingol/yt-dlp.git"
            ```
          files: release/*
          fail_on_unmatched_files: false
