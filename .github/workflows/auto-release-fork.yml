name: Auto release fork

on:
  workflow_run:
    workflows: ['Sync upstream']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Tag and release if upstream version changed
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current upstream version
        id: version
        run: |
          ver=$(python3 -c "import re; print(re.search(r\"__version__ = '(.+)'\", open('yt_dlp/version.py').read()).group(1))")
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - name: Find next available fork.N tag
        id: tag
        run: |
          ver="${{ steps.version.outputs.version }}"
          n=1
          while git ls-remote --tags origin "refs/tags/v${ver}-fork.${n}" | grep -q .; do
            n=$((n + 1))
          done
          echo "tag=v${ver}-fork.${n}" >> "$GITHUB_OUTPUT"

      - name: Skip if fork.1 already exists (no new upstream version)
        id: should_release
        run: |
          ver="${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/v${ver}-fork.1" | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.should_release.outputs.skip == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"
