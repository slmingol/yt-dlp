name: Sync upstream

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    name: Rebase fork patches onto upstream/master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: git remote add upstream https://github.com/yt-dlp/yt-dlp.git

      - name: Fetch upstream
        run: git fetch upstream master

      - name: Rebase onto upstream/master
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rebase upstream/master

      - name: Push
        run: git push origin main --force-with-lease

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Sync upstream failed: rebase conflict';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-failure',
            });
            if (!issues.data.find(i => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `The daily upstream sync failed on run [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).\n\nLikely cause: rebase conflict between a fork patch and an upstream change. Resolve manually:\n\n\`\`\`bash\ngit fetch upstream\ngit checkout main\ngit rebase upstream/master\n# fix conflicts\ngit push origin main --force-with-lease\n\`\`\``,
                labels: ['sync-failure'],
              });
            }
